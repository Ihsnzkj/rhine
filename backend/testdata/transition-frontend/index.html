<!doctype html><html><meta charset="utf-8"><title>Transition recording fixture</title>
<style>
html,body { margin:0; width:100%; height:100%; background:transparent; overflow:hidden }
img { position:fixed; inset:0; width:100%; height:100%; }
html.page { background:#e7e5e1; }
html.page body { background:linear-gradient(to right,#b9e432 0 25%,#e7e5e1 25% 100%); }
html.page img { display:none }
</style>
<script>
const send=m=>webkit.messageHandlers.rhine.postMessage(m);
window.showPage=()=>{document.documentElement.classList.add('page');return true};
window.__rhine={receive(m){
  if(m.type==='init'&&!window.fixtureInit){
    window.fixtureInit=m;
    (async()=>{
      const missing=await fetch('rhine://screenshot/not-an-output');
      window.missingStatus=missing.status;
      if(m.screenshot){
        const response=await fetch(m.screenshot), bytes=await response.arrayBuffer();
        window.pngSignature=Array.from(new Uint8Array(bytes).slice(0,8));
        window.pngMime=response.headers.get('Content-Type');
        const img=new Image();img.crossOrigin="anonymous";img.src=m.screenshot;await img.decode();
        const canvas=document.createElement('canvas');canvas.width=img.naturalWidth;canvas.height=img.naturalHeight;
        const ctx=canvas.getContext('2d');ctx.drawImage(img,0,0);
        const digest=await crypto.subtle.digest('SHA-256',ctx.getImageData(0,0,canvas.width,canvas.height).data);
        window.screenshotHash=Array.from(new Uint8Array(digest)).map(x=>x.toString(16).padStart(2,'0')).join('');
        document.body.append(img);
      }
      requestAnimationFrame(()=>requestAnimationFrame(()=>window.pagePainted=true));
    })().catch(e=>window.fixtureError=String(e));
  }
  if(m.type==='auth'&&m.state==='success')send({type:'unlock-ready'});
}};
addEventListener('DOMContentLoaded',()=>send({type:'hello',protocol:1}));
</script></html>
