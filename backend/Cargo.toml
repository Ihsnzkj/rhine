[package]
name = "rhine-lock"
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
license = "AGPL-3.0-or-later"
description = "Wayland screen locker (ext-session-lock-v1) with a WebKitGTK frontend in the Arknights Rhine Lab style"
repository = "https://github.com/tmc5csxr9m-cpu/rhine-lock"
keywords = ["wayland", "screen-locker", "ext-session-lock", "gtk4", "webkitgtk"]
categories = ["gui"]

[features]
default = []
mock-auth = ["dep:subtle"]

[dependencies]
gtk = { package = "gtk4", version = "0.11", features = ["v4_18"] }
session_lock = { package = "gtk4-session-lock", version = "0.4", features = ["v1_2"] }
percent-encoding = "2"
roxmltree = "0.21"
webkit = { package = "webkit6", version = "0.6" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
libc = "0.2"
zeroize = "1"
subtle = { version = "2", optional = true }
url = "2"
mime_guess = "2"
zbus = "5"
# Resolver hooks are explicitly outside ureq's semver surface; review upgrades.
ureq = "=3.4.2"

[profile.release]
strip = true

[dev-dependencies]
tempfile = "3"

[build-dependencies]
pkg-config = "0.3"
